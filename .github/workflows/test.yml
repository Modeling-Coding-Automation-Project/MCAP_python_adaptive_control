name: Test data-driven control

on:
  push:
    branches: 
    - develop
    
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.MCAP_SUBMODULE_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python sample/data_driven/vrft_demo.py --no-plot
      - run: python sample/data_driven/frit_demo.py --no-plot
